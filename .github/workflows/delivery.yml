name: Meridian delivery

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: meridian-heavy
  queue: max
  cancel-in-progress: false

env:
  MERIDIAN_ROOT: ${{ github.workspace }}
  UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.runtime/python
  UV_PYTHON_DOWNLOADS: never
  TEMP: ${{ github.workspace }}/.tmp
  TMP: ${{ github.workspace }}/.tmp
  TMPDIR: ${{ github.workspace }}/.tmp
  PYTHONPYCACHEPREFIX: ${{ github.workspace }}/.cache/pycache
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/playwright
  npm_config_cache: ${{ github.workspace }}/.cache/npm
  MERIDIAN_NO_KEY: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  UV_CONCURRENT_BUILDS: '1'
  UV_CONCURRENT_DOWNLOADS: '4'
  GOMAXPROCS: '2'
  NODE_OPTIONS: --max-old-space-size=1536

jobs:
  delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: mkdir -p .tmp .cache/uv .cache/npm .runtime/python docs/ci dist/delivery
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          enable-cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked verification dependencies
        run: |
          uv sync --locked --extra dev
          npm --prefix frontend ci --maxsockets=2
      - name: Audit original evidence and run regression tests
        run: |
          uv run --locked python scripts/ci_verify.py audit
          uv run --locked pytest --ignore=tests/test_cad.py --ignore=tests/test_loader.py --junitxml=dist/delivery/pytest.xml
      - name: Build the included frontend
        run: |
          npm --prefix frontend run build
          uv run --locked python -m scripts.frontend_artifact manifest
      - name: Assemble the complete source and prepared-data ZIP
        run: uv run --locked python -m scripts.package_delivery
      - name: Follow README from clean extracted ZIP with automatic Python setup
        run: uv run --locked python -m scripts.verify_delivery native --archive "$(find dist/delivery -maxdepth 1 -name '*.zip' -print -quit)"
      - name: Record delivery checksums
        run: |
          cd dist/delivery
          sha256sum meridian-v1-*.zip verification-*.json package.json > SHA256SUMS
      - name: Save complete deliverable and verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: meridian-delivery-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: dist/delivery/

  windows-startup:
    needs: delivery
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GH_CONFIG_DIR: ${{ github.workspace }}/.runtime/gh
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare workspace-local writable state
        shell: pwsh
        run: New-Item -ItemType Directory -Force .tmp,.cache/uv,.runtime/python,.runtime/gh,dist/delivery | Out-Null
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          enable-cache: false
      - name: Install the verifier outside the extracted app
        run: uv sync --locked --extra dev
      - name: Download exactly the Linux job's packaged app
        run: gh run download ${{ github.run_id }} --repo ${{ github.repository }} --name meridian-delivery-${{ github.run_id }} --dir dist/delivery
      - name: Follow Windows README launcher with automatic Python setup
        shell: pwsh
        run: |
          $archive = (Get-ChildItem dist/delivery/meridian-v1-*.zip).FullName
          uv run --locked python -m scripts.verify_delivery native --archive $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item -LiteralPath dist/delivery/verification-native.json -Destination dist/delivery/verification-windows.json
      - name: Save Windows launch verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: meridian-windows-${{ github.run_id }}
          retention-days: 14
          path: |
            dist/delivery/verification-windows.json
            dist/delivery/delivery-startup.log
