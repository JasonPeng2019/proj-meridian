name: Meridian verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live_api:
        description: Run paid GPT-6-luna questions and isolated correction UI
        type: boolean
        default: false

permissions:
  contents: read

# One remote run at a time, including manual runs and pull requests. All heavy
# stages below are sequential steps in a single job; no parallel job matrix.
concurrency:
  group: meridian-heavy
  queue: max
  cancel-in-progress: false

env:
  MERIDIAN_ROOT: ${{ github.workspace }}
  UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.runtime/python
  UV_PYTHON_DOWNLOADS: never
  TEMP: ${{ github.workspace }}/.tmp
  TMP: ${{ github.workspace }}/.tmp
  TMPDIR: ${{ github.workspace }}/.tmp
  PYTHONPYCACHEPREFIX: ${{ github.workspace }}/.cache/pycache
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/playwright
  npm_config_cache: ${{ github.workspace }}/.cache/npm
  PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
  CODEX_HOME: ${{ github.workspace }}/.runtime/codex
  CLAUDE_CONFIG_DIR: ${{ github.workspace }}/.runtime/claude
  MERIDIAN_NO_KEY: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  VTK_SMP_MAX_THREADS: '1'
  UV_CONCURRENT_BUILDS: '1'
  UV_CONCURRENT_DOWNLOADS: '4'
  CI: 'true'

jobs:
  verify:
    name: Build, tests, CAD, clean runtime, browser (sequential)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare project-local writable directories
        run: mkdir -p .tmp .cache/uv .cache/npm .cache/pycache .cache/playwright .runtime/python docs/ci
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: |
          uv sync --locked --extra dev --extra cad
          npm --prefix frontend ci --maxsockets=2
      - name: Check pinned source evidence and tracked paths
        run: uv run --locked python scripts/ci_verify.py audit
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Run tests in one process
        run: uv run --locked pytest --junitxml=docs/ci/pytest.xml
      - name: Generate and roundtrip all six CAD variants
        run: uv run --locked python scripts/ci_verify.py cad
      - name: Install headless browser and Linux dependencies
        run: uv run --locked playwright install --with-deps chromium
      - name: Verify fresh runtime and cache regeneration without a key
        run: uv run --locked python scripts/verify_release.py --skip-live
      - name: Verify browser pages and screenshots without a key
        run: uv run --locked python scripts/ci_verify.py browser
      - name: Optional live questions
        if: github.event_name == 'workflow_dispatch' && inputs.live_api
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: uv run --locked python scripts/ci_verify.py live
      - name: Optional live correction in isolated clone
        if: github.event_name == 'workflow_dispatch' && inputs.live_api
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: uv run --locked python scripts/verify_release.py
      - name: Recheck original source evidence
        if: always()
        run: uv run --locked python scripts/ci_verify.py audit
      - name: Save reports, screenshots and built app
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: meridian-${{ github.run_number }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            frontend/dist/
            generated/
            docs/ci/
            docs/verification/
