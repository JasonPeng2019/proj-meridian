services:
  meridian:
    image: meridian:local
    platform: linux/amd64
    build: .
    ports:
      - "127.0.0.1:8001:8001"
    env_file:
      - path: .env
        required: false
    environment:
      MERIDIAN_DEBUG_UI: ${MERIDIAN_DEBUG_UI:-0}
    volumes:
      - ./generated:/app/generated
      - ./decisions:/app/decisions
      - ./.runtime:/app/.runtime
    cpus: 2
    mem_limit: 2g
    stop_grace_period: 15s
