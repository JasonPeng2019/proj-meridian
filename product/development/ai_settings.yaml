# All product AI identities, credential locations and drawing layout live here.
reviewer_name: Jason Peng

chat:
  provider: openai
  api: responses
  model: gpt-6-luna
  fallback_models: []
  history_turns: 10
  # Local JSON storage, independent of chat credentials; M15 owns persistence.
  history_dir_env: MERIDIAN_CHAT_HISTORY_DIR
  credentials:
    server_only: true
    secrets_dir: ../../../.secrets
    secrets_dir_env: MERIDIAN_SECRETS_DIR
    key_file: OpenAI_API_Keys.txt

ui:
  debug_enabled: false
  debug_env: MERIDIAN_DEBUG # Only 1 enables Debug; unset/0 disables it.

prep:
  max_concurrent_jobs: 1 # Reserve two reader slots inside the shared four-CLI ceiling.
  reserved_reader_slots: 2
  max_cli_processes: 4 # Includes owner and children; a ceiling, not a target.
  pipeline:
    version: determine-verify/v1
    execution: sequential
    stages:
      - {role: determiner, reader: sol}
      - {role: verifier, reader: opus}
    verifier_input: exact_candidate_and_original_evidence
    require_candidate_source_binding: true
    require_per_field_verdict_reason_evidence: true
    max_disagreement_retries: 1 # One Sol correction, then one Opus reverification.
    retain_all_rounds: true
    unresolved_states: [disagrees, unsure, invalid]
  authentication: cli_accounts_only
  pass_app_key_to_cli: false
  readers:
    sol:
      cli: codex
      model: gpt-6.1-sol
      reasoning_effort: max
      service_tier: fast # Codex spelling for priority processing.
      read_only: true
      command:
        qualification:
          report: testing/reports/qualification/A08-runner/qualification.json
          notes: testing/reports/qualification/A08-runner/QUALIFICATION.md
          commit: 0e66458
          attempt: sol-2
          scope: synthetic_image_cli_capability_only
          limitations:
            - Effective model, reasoning effort, service tier and sandbox are not exposed.
            - Do not use reserved model_providers.openai overrides; sol-1 was rejected.
            - Built-in provider retry defaults remain; catalog refresh timed out nonfatally.
            - Does not qualify real-source validation or the determine-verify pipeline.
        prompt_transport: stdin
        # argv only; expand per-job paths inside the job workspace, never a shell.
        argv_template:
          - codex
          - --no-daemon
          - exec
          - --model
          - "{model}"
          - --ignore-user-config
          - --ignore-rules
          - --ephemeral
          - --skip-git-repo-check
          - --sandbox
          - read-only
          - --disable
          - hooks
          - --disable
          - shell_tool
          - --disable
          - multi_agent
          - --disable
          - shell_snapshot
          - -c
          - 'model_reasoning_effort={reasoning_effort}'
          - -c
          - 'service_tier={service_tier}'
          - -c
          - approval_policy=never
          - -c
          - project_doc_max_bytes=0
          - -c
          - skills.bundled.enabled=false
          - -c
          - skills.include_instructions=false
          - -c
          - history.persistence=none
          - -c
          - web_search=disabled
          - -c
          - analytics.enabled=false
          - -c
          - feedback.enabled=false
          - -c
          - 'sqlite_home="{codex_state_dir}"'
          - -c
          - 'log_dir="{codex_log_dir}"'
          - --color
          - never
          - --json
          - --image
          - "{image}"
          - --output-schema
          - "{output_schema_file}"
          - --output-last-message
          - "{last_message_file}"
          - "-"
    opus:
      cli: claude
      model: claude-opus-5-5
      effort: xhigh
      fastMode: false
      fallbackModel: []
      read_only: true
      command:
        qualification:
          report: testing/reports/qualification/A08-runner/qualification.json
          notes: testing/reports/qualification/A08-runner/QUALIFICATION.md
          commit: 0e66458
          attempt: opus-1
          scope: synthetic_image_cli_capability_only
          limitations:
            - Effective named effort and fallback list are not exposed.
            - Avoid --bare because it excludes account OAuth.
            - Image path is supplied in stdin prompt and read with the Read tool.
            - Does not qualify real-source validation or the determine-verify pipeline.
        prompt_transport: stdin
        prompt_image: "{image}"
        # Materialize per job; preserve the qualified settings without credentials.
        settings_template:
          model: "{model}"
          effortLevel: "{effort}"
          fastMode: false
          fallbackModel: []
          disableAllHooks: true
          autoMemoryEnabled: false
        environment_template:
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
          CLAUDE_CODE_DISABLE_FAST_MODE: "1"
          CLAUDE_CODE_MAX_RETRIES: "0"
          DISABLE_AUTOUPDATER: "1"
          DISABLE_TELEMETRY: "1"
          DISABLE_ERROR_REPORTING: "1"
          NO_COLOR: "1"
        argv_template:
          - claude
          - -p
          - --model
          - "{model}"
          - --effort
          - "{effort}"
          - --safe-mode
          - --restricted
          - --setting-sources
          - ""
          - --settings
          - "{claude_settings_file}"
          - --strict-mcp-config
          - --tools
          - Read
          - --allowedTools
          - Read
          - --permission-mode
          - plan
          - --permission-prompts
          - none
          - --no-session-persistence
          - --disable-slash-commands
          - --no-chrome
          - --output-format
          - stream-json
          - --verbose
          - --json-schema
          - "{output_schema_json}"
  opus_execution_failure:
    action: continue_sol_only
    provenance: single_model_unverified
    debug_label: UNVERIFIED
    retain_failed_attempt: true
    count_as_verified: false
    require_valid_source_backed_candidate: true
    eligible_after_disagreement_or_invalid_output: false
    retry_opus_on_each_launch: true
    # A disagreement/unsure/invalid field is not an execution failure.
    eligible_only_after_invocation_troubleshooting: true

paths:
  # All relative paths are relative to development/, independent of shell CWD.
  evidence_root: inputs/project-meridian
  dataset: inputs/project-meridian/dataset
  attribution: inputs/project-meridian/ATTRIBUTION.md
  license: inputs/project-meridian/dataset/context/OpenLPBF-LICENSE.md
  frontend_dist: frontend/dist
  generated: generated
  decisions: decisions
  chat_history: chat_history # Private local JSON; ignored, never a product input.

drawing_layout:
  coordinate_system: pdf_points_top_left
  fields:
    title: {label: "TITLE/DESCRIPTION:", value_location: below, multiline: false}
    notes: {label: "NOTE:", value_location: below, multiline: true}
    company: {label: "COMPANY:", value_location: below, multiline: false}
    material: {label: "MATERIAL:", value_location: right, stop_at_label: WEIGHT}
    weight: {label: "WEIGHT [g]:", value_location: right}
    drawn_by: {label: DRAWN, value_location: right}
    date: {label: DATE, value_location: right}
    scale: {label: "SCALE:", value_location: same_word}
  deduplicate_coincident_words: true
  stop_at_adjacent_labels: true
  unsure_if: [missing, placeholder, overlapping]
  placeholder_values: [Description]
  preserve_notes_verbatim: true
  scan:
    # Proposal A2 requires measurement from clean drawings; no invented boxes.
    measurement_status: pending_A05_clean_drawing_measurement
    corner_box: null
    field_boxes: null
