[project]
name = "project-meridian"
version = "0.1.0"
description = "Evidence-grounded drawing intelligence for the OpenLPBF snapshot"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115", "uvicorn>=0.34", "pymupdf>=1.25", "pandas>=2.2", "pyyaml>=6", "openai>=2", "python-dotenv>=1", "httpx>=0.28"]

[project.optional-dependencies]
cad = ["cadquery>=2.6"]
dev = ["pytest>=8", "playwright>=1.50", "trimesh>=4.6"]

[project.scripts]
meridian = "backend.app.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.tmp/pytest -q"
